services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grading
      POSTGRES_PASSWORD: grading
      POSTGRES_DB: grading
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - grading-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grading -d grading"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  grading-data:
